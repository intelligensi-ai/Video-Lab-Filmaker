<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Linear gradient for 'Lab' text transitioning from vibrant teal to light mint cyan -->
    <linearGradient id="videolab-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <!-- Subtle glow/shadow for icon -->
    <filter id="node-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00695C" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- ICON: Geometric Neural Constellation & Play Triangle -->
  <g class="videolab-icon" filter="url(#node-glow)">
    <!-- Network Connecting Lines -->
    <g stroke="#008075" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
      <!-- Outer perimeter lines -->
      <line x1="14" y1="60" x2="32" y2="30" />
      <line x1="14" y1="60" x2="32" y2="90" />
      <line x1="32" y1="30" x2="58" y2="12" />
      <line x1="32" y1="90" x2="58" y2="108" />

      <!-- Lines to Play Triangle Left Edge -->
      <line x1="58" y1="12" x2="96" y2="28" />
      <line x1="58" y1="108" x2="96" y2="92" />
      <line x1="32" y1="30" x2="96" y2="28" />
      <line x1="32" y1="90" x2="96" y2="92" />

      <!-- Center node hub connections -->
      <line x1="14" y1="60" x2="62" y2="60" />
      <line x1="32" y1="30" x2="62" y2="60" />
      <line x1="32" y1="90" x2="62" y2="60" />
      <line x1="58" y1="12" x2="62" y2="60" />
      <line x1="58" y1="108" x2="62" y2="60" />
      <line x1="62" y1="60" x2="96" y2="60" />

      <!-- Cross web reinforcement lines -->
      <line x1="58" y1="12" x2="96" y2="50" />
      <line x1="58" y1="108" x2="96" y2="70" />
      <line x1="62" y1="60" x2="96" y2="38" />
      <line x1="62" y1="60" x2="96" y2="82" />
    </g>

    <!-- Play Triangle -->
    <path d="M 96 26 C 96 24 98 23 100 24 L 148 57 C 150 58.5 150 61.5 148 63 L 100 96 C 98 97 96 96 96 94 Z" fill="#008075" />

    <!-- Constellation Nodes (Dots) -->
    <g fill="#008075">
      <circle cx="14" cy="60" r="5.5" />
      <circle cx="32" cy="30" r="5.5" />
      <circle cx="32" cy="90" r="5.5" />
      <circle cx="58" cy="12" r="5.5" />
      <circle cx="58" cy="108" r="5.5" />
      <circle cx="62" cy="60" r="6" />
    </g>
  </g>

  <!-- WORDMARK: VideoLab -->
  <text x="168" y="88"
    font-family="'Plus Jakarta Sans', 'Poppins', 'Montserrat', 'Inter', -apple-system, sans-serif"
    font-weight="800"
    font-size="80"
    letter-spacing="-0.02em">
    <tspan fill="#14B8A6">Video</tspan><tspan fill="url(#videolab-gradient)">Lab</tspan>
  </text>
</svg>
